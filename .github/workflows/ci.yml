  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  upload:
    name: Upload artifact
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: |
          echo "Pytest passed for commit $GITHUB_SHA" > result.txt

      - name: Upload the file
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: result.txt
          if-no-files-found: error
